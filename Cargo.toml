[package]
name = "vsixpublisher"
version = "0.1.0"
edition = "2024"
authors = ["Christian Resma Helle"]
description = "Cross-platform Rust port of the Visual Studio Marketplace VsixPublisher tool"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
quick-xml = "0.37"
tempfile = "3"
dirs = "6"
url = "2"

[dev-dependencies]
mockito = "1"
assert_cmd = "2"
predicates = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
