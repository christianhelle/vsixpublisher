[package]
name = "vsixpublisher"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
authors = ["Christian Resma Helle"]
description = "Publish Visual Studio extensions to the Visual Studio Marketplace from Windows, Linux or macOS"
license = "MIT"
readme = "README.md"
repository = "https://github.com/christianhelle/vsixpublisher"
homepage = "https://github.com/christianhelle/vsixpublisher"
keywords = ["vsix", "visual-studio", "marketplace", "publish", "extension"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/", ".devcontainer/", ".gitattributes", "docs/"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
quick-xml = "0.37"
tempfile = "3"
url = "2"

# OS TLS (SChannel / Security.framework) where it ships with the system; rustls elsewhere.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["native-tls-no-default"] }

[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
mockito = "1"
assert_cmd = "2"
predicates = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
